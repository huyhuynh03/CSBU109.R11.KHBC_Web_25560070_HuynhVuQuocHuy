<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Picture</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef1f6; margin: 0; padding: 24px; color: #222; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 20px; max-width: 720px; margin: 0 auto 20px; }
    h2 { margin: 0 0 4px; text-align: center; }
    .sub { color: #666; text-align: center; font-size: 14px; margin-top: 0; }
    .preview { display: block; max-width: 200px; margin: 12px auto; border-radius: 8px; }
    .hidden { display: none; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; }
    #upload-btn { background: #6366f1; color: #fff; display: block; margin: 12px auto; }
    .message { text-align: center; padding: 8px; border-radius: 4px; margin-top: 8px; }
    .message.error { background: #d9534f; color: #fff; }
    .message.success { background: #5cb85c; color: #fff; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .item { border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 12px; }
    .item img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
    .name { word-break: break-all; margin: 6px 0; }
    .item a { color: #2563eb; margin-right: 8px; }
    .delete { background: #d9534f; color: #fff; font-size: 12px; padding: 4px 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Profile Picture</h2>
    <p class="sub">Select an image to upload as your avatar (JPG, PNG, WEBP, max 2 MB).</p>
    <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp">
    <img id="preview" class="preview hidden" alt="Preview">
    <button id="upload-btn">Upload Avatar</button>
    <div id="message" class="message hidden"></div>
  </div>

  <div class="card">
    <h3>Uploaded Files (<span id="count">0</span>)</h3>
    <div id="gallery" class="gallery"></div>
  </div>

  <script>
    const API = 'http://localhost:5001';

    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const uploadBtn = document.getElementById('upload-btn');
    const message = document.getElementById('message');
    const gallery = document.getElementById('gallery');
    const countLabel = document.getElementById('count');

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? 'message error' : 'message success';
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) {
        preview.classList.add('hidden');
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.classList.remove('hidden');
    });

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        showMessage('Please choose an image file!', true);
        return;
      }
      // Do not set Content-Type manually: the browser adds the multipart boundary
      const formData = new FormData();
      formData.append('avatar', file);
      try {
        const response = await fetch(`${API}/api/v1/upload-avatar`, { method: 'POST', body: formData });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || `HTTP ${response.status}`);
        showMessage(`Uploaded ${result.fileInfo.filename} (${result.fileInfo.size} bytes)`, false);
        fileInput.value = '';
        preview.classList.add('hidden');
        loadFiles();
      } catch (error) {
        showMessage(error.message, true);
      }
    });

    async function deleteFile(filename) {
      try {
        const response = await fetch(`${API}/api/v1/files/${encodeURIComponent(filename)}`, { method: 'DELETE' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || `HTTP ${response.status}`);
        showMessage(result.message, false);
        loadFiles();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    async function loadFiles() {
      try {
        const response = await fetch(`${API}/api/v1/files`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || `HTTP ${response.status}`);
        countLabel.textContent = result.count;
        gallery.innerHTML = '';
        for (const file of result.data) {
          const card = document.createElement('div');
          card.className = 'item';
          card.innerHTML = `
            <img src="${escapeHtml(file.url)}" alt="${escapeHtml(file.filename)}">
            <div class="name">${escapeHtml(file.filename)}</div>
            <a href="${escapeHtml(file.downloadUrl)}">Download</a>
            <button class="delete">Delete</button>`;
          card.querySelector('.delete').addEventListener('click', () => deleteFile(file.filename));
          gallery.appendChild(card);
        }
      } catch (error) {
        showMessage(`Error loading files: ${error.message}`, true);
      }
    }

    loadFiles();
  </script>
</body>
</html>
