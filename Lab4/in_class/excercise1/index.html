<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 20px; }
    form, .filter { margin-bottom: 12px; }
    input, select, button { padding: 6px 8px; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; }
    th { background: #1f4e79; color: #fff; text-align: left; padding: 8px; }
    td { border-bottom: 1px solid #ddd; padding: 8px; }
    td input { width: 95%; }
    .btn-edit { background: #f0ad4e; color: #fff; border: none; }
    .btn-delete { background: #d9534f; color: #fff; border: none; }
    .btn-save { background: #5cb85c; color: #fff; border: none; }
    .btn-cancel { background: #6c757d; color: #fff; border: none; }
    .error { background: #d9534f; color: #fff; padding: 10px; border-radius: 4px; margin-bottom: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Product Management (Client Web UI)</h1>
  <div id="error" class="error hidden"></div>

  <form id="add-form">
    <input id="name-input" placeholder="Product name">
    <input id="price-input" type="number" min="0" placeholder="Price (VND)">
    <input id="category-input" placeholder="Category">
    <button type="submit">Add product</button>
  </form>

  <div class="filter">
    <label for="category-filter">Filter by Category:</label>
    <select id="category-filter">
      <option value="">All Categories</option>
    </select>
  </div>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Price (VND)</th><th>Category</th><th>Actions</th></tr>
    </thead>
    <tbody id="product-body"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
